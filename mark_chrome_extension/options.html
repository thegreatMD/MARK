<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mark settings</title><link rel="stylesheet" href="options.css"></head><body><main><h1>Mark Chrome Companion</h1><p>Use the local Mark server by default. Set a token only if <code>MARK_API_TOKEN</code> is set in Mark’s <code>.env</code>.</p><label>Mark API endpoint<input id="endpoint" type="url" required></label><label>Connection token (optional)<input id="token" type="password" autocomplete="off"></label><button id="save">Save settings</button><p id="status" role="status"></p><hr><p><strong>Shortcut:</strong> Alt+M opens Mark. On a page, select text first for a focused answer. Mark only receives page content after you press Send.</p></main><script src="options.js"></script></body></html>
